name: Keep Render Awake

on:
  schedule:
    # каждые 10 минут
    - cron: '*/10 * * * *'
  workflow_dispatch: # можно запускать вручную

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://skillup-academy-r2ge.onrender.com/ || true
          echo "Ping sent at $(date -u)"
